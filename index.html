<!DOCTYPE html>
<html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orar grupă</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#4f46e5">
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131a;--cd:#1c1e29;--tx:#eceef6;--mu:#9a9fb2;--ac:#8b85ff;--ok:#4ade80;--no:#f87171;--bd:#2c2f3f}}
:root[data-theme="dark"]{--bg:#12131a;--cd:#1c1e29;--tx:#eceef6;--mu:#9a9fb2;--ac:#8b85ff;--ok:#4ade80;--no:#f87171;--bd:#2c2f3f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:600px;margin:0 auto;padding:14px 14px 70px}
h1{font-size:21px;margin:2px 0 10px}h2{font-size:14px;color:var(--mu);margin:18px 0 8px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:9px}
.now{border-left:5px solid var(--ac)}.b{font-weight:700}.mu{color:var(--mu);font-size:13.5px}
.tabs{display:flex;gap:5px;margin-bottom:10px}
button{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:9px 8px;cursor:pointer}
.tabs button{flex:1;font-size:12.5px;padding:9px 3px}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.r{display:flex;gap:6px;margin-top:8px}.r button{flex:1}

</style></head><body><div id="ov" style="position:fixed;inset:0;z-index:9;background:var(--bg);align-items:center;justify-content:center;padding:20px;overflow:auto"><div class="c" style="width:100%;max-width:380px"><div class="b" style="font-size:20px">📚 Orar grupă</div><div class="mu" style="margin:6px 0 10px">Intră sau creează cont (email + parolă).</div><input id="an" maxlength="24" placeholder="Numele tău (doar la cont nou)" class="fi"><input id="au" type="email" placeholder="Email" autocapitalize="none" autocomplete="email" class="fi"><input id="ap" type="password" placeholder="Parolă (minim 6 caractere)" autocomplete="current-password" class="fi"><div id="er" class="mu" style="color:var(--no);min-height:18px"></div><div class="mu" style="margin:-4px 0 10px"><a href="#" id="fg">Ai uitat parola?</a></div><label class="mu" style="display:flex;gap:8px;align-items:center;margin:0 0 10px"><input type="checkbox" id="rm" checked style="width:auto;margin:0"> Ține-mă minte pe acest dispozitiv</label><div class="r"><button id="lg" class="on">Intră</button><button id="rg">Cont nou</button></div></div></div><main>
<h1>📚 Orar grupă</h1>

<section id="m" class="hide"><div class="r" style="margin:0 0 8px"><select id="mg" class="fi" style="margin:0"></select><button id="mx" style="flex:0 0 auto;padding:9px 12px">⬇ CSV</button></div><div class="mu" id="mc" style="margin-bottom:8px"></div><div id="ml"></div></section>
<p class="mu" id="note"></p>
</main>
<script type="module">

[3,'10:00','11:50',CO,'SEM','JE108',CD,'p'],[3,'12:00','13:50',AL,'SEM','JL309',SE,'b'],[3,'14:00','15:50',PS,'SEM','JE107',HS,'b'],[3,'16:00','17:50',PS,'CURS','JE108',HS,'b'],
[4,'9:00','11:50',S,'CURS','JA101',VM,'b'],[4,'12:00','13:50',P,'CURS','JA101',NE,'b'],[4,'14:00','15:50',PM,'CURS','JA101',MA,'b'],[4,'16:00','17:50',CH,'CURS','JA101',MA,'b'],

  const pn=par(mon(0)),pt=x=>x==='i'?'IMPARĂ':'PARĂ',sun=addD(mon(0),6),f=d=>d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0');

document.addEventListener('click',e=>{if(e.target.id==='chg'){e.preventDefault();signOut(auth);return}const b=e.target.closest('[data-k]');if(b)return setAtt(b.dataset.k,+b.dataset.v);const t=e.target.closest('[data-t]');if(t){document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===t));['a','s','r','o','p','m'].forEach(i=>$(i).classList.toggle('hide',i!==t.dataset.t))}});

$('sw').onclick=()=>{swap=1-swap;try{localStorage.setItem('swap',swap)}catch(e){}render()};
const CFG={apiKey:"AIzaSyDLnd7BAqNvM6ZsgmvpMg3ZBsZmtVEYTn4",authDomain:"orar-upb.firebaseapp.com",projectId:"orar-upb",storageBucket:"orar-upb.firebasestorage.app",messagingSenderId:"970129347906",appId:"1:970129347906:web:71da2aee9c7424dc08a4db"};
let isAdm=false,myGroup='';const grp={},ng=g=>String(g||'').toUpperCase().replace(/[^A-Z0-9 ._-]/g,'').trim().slice(0,12),sameG=u=>!myGroup||grp[u]===myGroup;
function renAdm(){if(!isAdm)return;const gs=[...new Set(Object.keys(all).map(u=>grp[u]||''))].sort(),sel=$('mg'),cv=sel.value;sel.innerHTML='<option value="*">Toate grupele</option>'+gs.map(g=>`<option value="${esc(g)}">${g?esc(g):'(fără grupă)'}</option>`).join('');sel.value=[...sel.options].some(o=>o.value===cv)?cv:'*';
 const f=sel.value,us=Object.keys(all).filter(u=>f==='*'||(grp[u]||'')===f).sort((a,b)=>String(names[a]||'').localeCompare(String(names[b]||'')));
 $('mc').textContent=us.length+' elevi';
 $('ml').innerHTML=us.map(u=>{const v=Object.values(all[u]),p=v.filter(x=>x===1).length,a=v.filter(x=>x===0).length;return`<div class="c"><div class="b">${esc(names[u]||'Elev')}<span class="tag">${esc(grp[u]||'fără grupă')}</span></div><div class="mu">✅ ${p} · ❌ ${a}</div><div class="r"><button data-ag="${u}">Schimbă grupa</button><button data-ad="${u}">Șterge</button></div></div>`}).join('')}
function fillProf(){const a=document.activeElement;if(a&&(a.id==='pn'||a.id==='pg'))return;$('pn').value=myName;$('pg').value=myGroup;$('pe').textContent=((auth.currentUser&&auth.currentUser.email)||'')+' · UID: '+(uid||'');$('gl').innerHTML=[...new Set(Object.values(grp).filter(Boolean))].map(g=>`<option value="${esc(g)}">`).join('')}
const fb=initializeApp(CFG),auth=getAuth(fb),fs=getFirestore(fb),pr={};let un=[],hb=null;
const em=u=>u.trim().toLowerCase(),er=(t,ok)=>{$('er').style.color=ok?'var(--ok)':'var(--no)';$('er').textContent=t};
const msg=c=>({'auth/invalid-credential':'Utilizator sau parolă greșită.','auth/email-already-in-use':'Există deja un cont cu acest email.','auth/weak-password':'Parola trebuie să aibă minim 6 caractere.','auth/invalid-email':'Email invalid.','auth/too-many-requests':'Prea multe încercări, așteaptă puțin.','auth/operation-not-allowed':'Activează Email/Password în Firebase.','auth/api-key-not-valid.-please-pass-a-valid-api-key.':'Cheia API e greșită.'}[c]||'Eroare: '+c);
async function go(reg){er('');const u=$('au').value,p=$('ap').value,n=$('an').value.trim().slice(0,24);if(!u.trim()||!p)return er('Completează emailul și parola.');if(!/^\S+@\S+\.\S+$/.test(em(u)))return er('Scrie un email valid.');if(reg&&!n)return er('Scrie și numele tău.');
  try{await setPersistence(auth,$('rm').checked?browserLocalPersistence:browserSessionPersistence);try{if($('rm').checked)localStorage.setItem('em',em(u));else localStorage.removeItem('em')}catch(x){}if(reg){const c=await createUserWithEmailAndPassword(auth,em(u),p);await updateProfile(c.user,{displayName:n});myName=n;names[c.user.uid]=n;showMe();setDoc(doc(fs,'attendance',c.user.uid),{m:{},n,g:''}).catch(()=>{});pres()}else await signInWithEmailAndPassword(auth,em(u),p)}catch(e){er(msg(e.code))}}
$('fg').onclick=async e=>{e.preventDefault();const u=$('au').value;if(!/^\S+@\S+\.\S+$/.test(em(u)))return er('Scrie emailul mai sus, apoi apasă din nou „Ai uitat parola?”.');try{await sendPasswordResetEmail(auth,em(u));er('Dacă există un cont cu acest email, ți-am trimis un link de resetare. Verifică și Spam.',1)}catch(x){er(msg(x.code))}};$('lg').onclick=()=>go(false);$('rg').onclick=()=>go(true);try{$('au').value=localStorage.getItem('em')||''}catch(e){}
$('psv').onclick=async()=>{if(!uid)return;const n=$('pn').value.trim().slice(0,24)||myName;myName=n;myGroup=ng($('pg').value);names[uid]=n;grp[uid]=myGroup;try{await updateProfile(auth.currentUser,{displayName:n})}catch(e){}setDoc(doc(fs,'attendance',uid),{m:{...mine},n:myName,g:myGroup}).catch(()=>{});pres();showMe();render();peers();$('pn').value=myName;$('pg').value=myGroup;$('pm').textContent='✓ Salvat'};
$('pout').onclick=()=>signOut(auth);
document.addEventListener('click',e=>{if(!isAdm)return;const g=e.target.closest('[data-ag]'),d=e.target.closest('[data-ad]');
 if(g){const u=g.dataset.ag,v=prompt('Grupa nouă pentru '+(names[u]||'elev')+':',grp[u]||'');if(v===null)return;setDoc(doc(fs,'attendance',u),{m:{...all[u]},n:names[u]||'',g:ng(v)}).catch(()=>alert('Nu ai drept de admin.'))}
 if(d){const u=d.dataset.ad;if(!confirm('Ștergi datele lui '+(names[u]||'elev')+'? Contul rămâne în Firebase Authentication.'))return;deleteDoc(doc(fs,'attendance',u)).catch(()=>{});deleteDoc(doc(fs,'presence',u)).catch(()=>{})}});
$('mg').onchange=renAdm;
$('mx').onclick=()=>{const q=x=>'"'+String(x==null?'':x).replace(/^[=+\-@]/,"'$&").replace(/"/g,'""')+'"';const rows=[['Nume','Grupa','Data','Ora','Materie','Tip','Status'].map(q).join(',')];
 for(const u in all)for(const k in all[u]){const[dt,i]=k.split('|'),c=T[+i];if(!c)continue;rows.push([names[u]||'',grp[u]||'',dt,c[1]+'-'+c[2],c[3],c[4],all[u][k]===1?'Prezent':'Absent'].map(q).join(','))}
 const b=new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='prezente.csv';a.click()};$('ap').onkeydown=e=>{if(e.key==='Enter')go(false)};
